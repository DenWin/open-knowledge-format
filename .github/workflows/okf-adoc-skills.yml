name: OKF AsciiDoc skills

on:
  push:
  pull_request:

jobs:
  skill-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: skill_tests/requirements.txt
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          ruby-version: "3.2.3"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r skill_tests/requirements.txt
          gem install asciidoctor --version 2.0.26 --no-document
      - name: Check generated payloads
        run: |
          python tools/okf_adoc_core/generate_agents.py --target all
          python tools/okf_adoc_core/generate_copilot_plugin.py
          python tools/okf_adoc_core/check_generated.py
          git diff --exit-code -- .github/agents/okf-adoption.agent.md skills/agents/okf-adoption.md plugins/okf
      - name: Run dependency-light skill suite
        run: python -m pytest -q skill_tests
